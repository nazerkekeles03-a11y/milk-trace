<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MilkTrace — цифровой паспорт молока</title>
<style>
:root{--ink:#152b39;--muted:#647786;--bg:#f3f7f7;--line:#dce6e7;--teal:#0e766d;--teal2:#e5f5f1;--red:#ab3d40;--redbg:#fff0ee;--yellow:#9b6814;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 24px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.logo{font-size:25px;font-weight:850;letter-spacing:-1px}.logo .drop{display:inline-grid;place-items:center;width:38px;height:38px;background:#11766e;color:white;border-radius:13px;font-size:21px;margin-right:10px}.logo small{font-size:11px;font-weight:600;display:block;color:var(--muted);letter-spacing:1.1px;margin-left:50px}button,.btn{cursor:pointer;background:var(--teal);color:white;border:1px solid var(--teal);border-radius:11px;font:inherit;font-weight:700;padding:11px 15px;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,.btn:hover{filter:brightness(.94)}button.secondary,.btn.secondary{background:white;color:var(--ink);border-color:var(--line)}button.ghost{background:transparent;color:var(--teal);border:none}button.danger{color:var(--red);background:white;border-color:#efd1d0}button:disabled{opacity:.5;cursor:not-allowed}.hero{background:linear-gradient(115deg,#063f43,#147e72);border-radius:23px;color:white;padding:31px 35px;display:flex;justify-content:space-between;gap:30px;margin-bottom:22px;overflow:hidden}.hero h1{font-size:32px;line-height:1.15;margin:0 0 10px;letter-spacing:-.8px}.hero p{max-width:670px;color:#d2eeeb;margin:0}.hero-ill{font-size:74px;align-self:center;opacity:.8}.tag{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:6px 9px;border-radius:20px;display:inline-block;background:#d8f4ec;color:#17675c}.demo{background:#fff6df;color:#865b11}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:21px}.stat small{display:block;color:var(--muted);font-weight:600}.stat strong{display:block;font-size:30px;line-height:1.3;margin-top:6px}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel h2{margin:0 0 15px;font-size:19px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.topline h2{margin:0}.list{display:grid;gap:9px;max-height:640px;overflow:auto}.item{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;background:white;color:var(--ink);display:block;width:100%;font-weight:400}.item.selected{background:var(--teal2);border-color:#7cbdb0}.item strong{display:block;font-size:14px}.item small{color:var(--muted)}.pill{font-size:11px;border-radius:7px;padding:4px 7px;font-weight:750;display:inline-block}.ok{background:#e7f7ed;color:#257846}.bad{background:var(--redbg);color:var(--red)}.warn{background:#fff3d7;color:var(--yellow)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px}.tabs button{background:#f5f7f7;color:var(--muted);border-color:transparent;padding:8px 12px}.tabs button.active{background:var(--teal2);color:var(--teal)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #cad8db;background:white;color:var(--ink);font:inherit;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #a4d6cf;border-color:var(--teal)}.notice{border-radius:11px;padding:13px 15px;background:var(--teal2);color:#245b57;margin:12px 0}.notice.warning{background:#fff2da;color:#8a5e18}.notice.error{background:var(--redbg);color:var(--red)}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.info{padding:14px;border:1px solid var(--line);border-radius:11px}.info span{display:block;font-size:12px;color:var(--muted)}.info b{font-size:16px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px}th{color:var(--muted);font-weight:750}td:last-child,th:last-child{text-align:right}.muted{color:var(--muted)}.tiny{font-size:12px}.chart{min-height:165px;margin-top:9px;position:relative;background:repeating-linear-gradient(0deg,#f1f5f5 0px,#f1f5f5 1px,transparent 1px,transparent 42px);border:1px solid var(--line);border-radius:10px;padding:12px}.chart svg{width:100%;height:175px}.passport{max-width:750px;margin:30px auto;background:white;border:1px solid var(--line);padding:32px;border-radius:22px;box-shadow:0 10px 36px #13352b10}.passport .seal{font-size:58px}.passport h1{font-size:30px;margin:10px 0 5px}.flow{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.step{background:#eef4f3;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border:1px dashed #a7c9c5;border-radius:14px;background:#fafdfd}.qrbox #qrcode img,.qrbox #qrcode canvas{max-width:100%;height:auto}.footer{margin-top:34px;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.separator{height:1px;background:var(--line);margin:22px 0}.toast{position:fixed;bottom:23px;right:23px;background:#123f3b;color:white;padding:12px 17px;border-radius:11px;box-shadow:0 8px 28px #0002;z-index:20}.mini-heading{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin-bottom:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.hero{padding:23px}.hero h1{font-size:26px}.hero-ill{display:none}.info-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.shell{padding:16px 12px 40px}.grid2,.info-grid{grid-template-columns:1fr}.stat strong{font-size:23px}.panel{padding:15px}.hero{border-radius:16px}.passport{padding:18px}header{align-items:flex-start}header .tag{max-width:125px;text-align:center}}
</style></head><body><div id="app"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
'use strict';const KEY='milktrace_v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const isoLocal=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;function demoData(){return [{id:'MILK-2026-001',farm:'Учебная ферма «Север»',place:'Петропавловск, СКО',volume:240,date:'2026-11-03T06:30',type:'Сырое коровье молоко',status:'Передано на переработку',notes:'Демонстрационная партия, данные вымышлены',temps:[{at:'2026-11-03T07:00',value:4.1,stage:'Охлаждение'},{at:'2026-11-03T09:30',value:4.6,stage:'Хранение'},{at:'2026-11-03T11:00',value:5.2,stage:'Транспортировка'}]},{id:'MILK-2026-002',farm:'Учебная ферма «Берёзка»',place:'Северо-Казахстанская область',volume:180,date:'2026-11-04T07:15',type:'Сырое коровье молоко',status:'На хранении',notes:'Демонстрационная партия, данные вымышлены',temps:[{at:'2026-11-04T07:30',value:4.5,stage:'Охлаждение'},{at:'2026-11-04T09:00',value:8.2,stage:'Хранение'}]}]};let batches;try{const d=JSON.parse(localStorage.getItem(KEY));batches=Array.isArray(d)?d:demoData()}catch{batches=demoData()}let selected=batches[0]?.id||null,tab='overview';const save=()=>localStorage.setItem(KEY,JSON.stringify(batches));save();const latest=b=>b.temps?.length?b.temps[b.temps.length-1]:null;const out=b=>b.temps?.some(t=>Number(t.value)<2||Number(t.value)>6);const formatDate=x=>x?new Date(x).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';function toast(s){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2900)}function getSelected(){return batches.find(b=>b.id===selected)}function status(b){return out(b)?'<span class="pill bad">Есть отклонение</span>':'<span class="pill ok">Без отклонений*</span>'}function head(){return `<header><div class="logo"><span class="drop">◈</span>MilkTrace<small>ЦИФРОВОЙ ПАСПОРТ МОЛОКА</small></div><span class="tag demo">Учебный прототип · 2026</span></header>`}const app=$('#app');function layout(){let total=batches.reduce((s,b)=>s+(Number(b.volume)||0),0);app.innerHTML=`<main class="shell">${head()}<section class="hero"><div><div class="tag" style="margin-bottom:12px">Ферма → потребитель</div><h1>Путь молока — под контролем</h1><p>Создавайте партии, фиксируйте температуру и формируйте цифровые паспорта. Учебный инструмент для небольших молочных хозяйств.</p></div><div class="hero-ill">🥛</div></section><section class="stats"><div class="stat"><small>Всего партий</small><strong>${batches.length}</strong></div><div class="stat"><small>Объём молока</small><strong>${total.toLocaleString('ru-RU')} л</strong></div><div class="stat"><small>Партий с отклонениями*</small><strong style="color:var(--red)">${batches.filter(out).length}</strong></div><div class="stat"><small>Записей температуры</small><strong>${batches.reduce((s,b)=>s+b.temps.length,0)}</strong></div></section><div class="layout"><section class="panel"><div class="topline"><h2>Партии молока</h2><button id="new" title="Создать партию">+ Новая</button></div><div class="list">${batches.length?batches.map(b=>`<button class="item ${b.id===selected?'selected':''}" data-pick="${esc(b.id)}"><span class="row between"><strong>${esc(b.id)}</strong>${status(b)}</span><small>${esc(b.farm)} · ${b.volume} л</small></button>`).join(''):'<div class="empty">Партий пока нет</div>'}</div><p class="muted tiny">* Порог 2–6 °C задан только как иллюстрация алгоритма; не является подтверждением нормативной безопасности молока.</p></section><section class="panel"><div id="detail"></div></section></div><div class="footer">MilkTrace · Учебный проект. Не является государственной системой маркировки, ветеринарным документом или сертификатом качества.</div></main>`;$('#new').onclick=()=>newForm();document.querySelectorAll('[data-pick]').forEach(e=>e.onclick=()=>{selected=e.dataset.pick;tab='overview';layout()});detail()}
function detail(){const b=getSelected();if(!b){$('#detail').innerHTML='<div class="empty">Выберите партию или создайте новую.</div>';return}$('#detail').innerHTML=`<div class="topline"><div><div class="mini-heading">Карточка партии</div><h2>${esc(b.id)}</h2></div>${status(b)}</div><div class="tabs">${[['overview','Обзор'],['temp','Температура'],['passport','QR-паспорт'],['edit','Изменить']].map(([id,t])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${t}</button>`).join('')}</div><div id="view"></div>`;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;detail()});if(tab==='overview')overview(b);if(tab==='temp')temperature(b);if(tab==='passport')passportTab(b);if(tab==='edit')editForm(b)}
function overview(b){let l=latest(b);$('#view').innerHTML=`<div class="mini-heading">Основные сведения</div><div class="info-grid"><div class="info"><span>Производитель</span><b>${esc(b.farm)}</b></div><div class="info"><span>Объём партии</span><b>${esc(b.volume)} л</b></div><div class="info"><span>Дата получения</span><b>${formatDate(b.date)}</b></div><div class="info"><span>Тип продукции</span><b>${esc(b.type)}</b></div><div class="info"><span>Этап</span><b>${esc(b.status)}</b></div><div class="info"><span>Последняя температура</span><b>${l?esc(l.value)+' °C':'Нет записей'}</b></div></div>${out(b)?'<div class="notice error"><b>Обнаружены температурные отклонения.</b> Необходима дополнительная оценка партии ответственным специалистом; решение о безопасности система не принимает.</div>':'<div class="notice">По введённым данным температурных отклонений от демонстрационного диапазона не зафиксировано. Это не подтверждает качество или безопасность продукции.</div>'}<div class="mini-heading">Производственный маршрут</div><div class="flow">${['Ферма','Сбор','Охлаждение','Транспортировка','Переработка','Потребитель'].map((x,i)=>`<div class="step">${i+1}. ${x}</div>`).join('')}</div><div class="mini-heading">Место происхождения</div><p>${esc(b.place)}</p><div class="mini-heading">Примечание</div><p>${esc(b.notes||'Не указано')}</p><div class="row"><button id="ovtemp">+ Температура</button><button class="secondary" id="ovpass">Открыть паспорт</button></div>`;$('#ovtemp').onclick=()=>{tab='temp';detail()};$('#ovpass').onclick=()=>{tab='passport';detail()}}
function spark(temps){if(!temps.length)return '<div class="empty">Добавьте температурные показатели</div>';let vs=temps.map(t=>Number(t.value));let min=Math.min(0,...vs)-1,max=Math.max(10,...vs)+1,coord=(v,i)=>`${20+i*640/Math.max(1,vs.length-1)},${160-(v-min)/(max-min)*135}`;return `<div class="chart"><svg viewBox="0 0 680 175" role="img" aria-label="График температуры"><rect x="10" y="${160-(6-min)/(max-min)*135}" width="660" height="${4/(max-min)*135}" fill="#dff3e8" opacity=".8"/><polyline fill="none" stroke="#0f8075" stroke-width="3" points="${vs.map((v,i)=>coord(v,i)).join(' ')}"/>${vs.map((v,i)=>{let [cx,cy]=coord(v,i).split(',');return `<circle cx="${cx}" cy="${cy}" r="5" fill="${v<2||v>6?'#b34145':'#0f8075'}"><title>${v} °C</title></circle>`}).join('')}</svg></div>`}
function temperature(b){$('#view').innerHTML=`<div class="notice warning"><b>Демонстрационное правило:</b> значение ниже 2 °C или выше 6 °C помечается как отклонение. Это учебная настройка, а не норматив для всех видов молока и стадий производства.</div><form id="tempForm"><div class="grid2"><div class="field"><label>Дата и время измерения</label><input type="datetime-local" name="at" value="${isoLocal()}" required></div><div class="field"><label>Температура, °C</label><input type="number" name="value" min="-20" max="60" step="0.1" placeholder="Например, 4.5" required></div></div><div class="field"><label>Этап</label><select name="stage"><option>Охлаждение</option><option>Хранение</option><option>Транспортировка</option><option>Переработка</option></select></div><button type="submit">+ Добавить измерение</button></form><div class="separator"></div><div class="topline"><h2>Журнал измерений</h2><span class="muted tiny">${b.temps.length} записей</span></div>${spark(b.temps)}<div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Этап</th><th>Температура</th><th>Оценка*</th><th></th></tr></thead><tbody>${b.temps.map((t,i)=>`<tr><td>${formatDate(t.at)}</td><td>${esc(t.stage)}</td><td>${esc(t.value)} °C</td><td>${Number(t.value)<2||Number(t.value)>6?'<span class="pill bad">Отклонение</span>':'<span class="pill ok">В диапазоне</span>'}</td><td><button class="ghost" data-deltemp="${i}" title="Удалить">×</button></td></tr>`).join('')}</tbody></table></div>`;$('#tempForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);b.temps.push({at:f.get('at'),value:Number(f.get('value')),stage:f.get('stage')});save();layout();tab='temp';detail();toast('Измерение добавлено')};document.querySelectorAll('[data-deltemp]').forEach(x=>x.onclick=()=>{if(confirm('Удалить измерение?')){b.temps.splice(Number(x.dataset.deltemp),1);save();layout();tab='temp';detail()}})}
const publicData=b=>({id:b.id,farm:b.farm,place:b.place,volume:b.volume,date:b.date,type:b.type,status:b.status,notes:b.notes,temps:b.temps});const b64=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));async function pack(o){const bytes=new TextEncoder().encode(JSON.stringify(o));if('CompressionStream'in window){const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return 'g'+b64(new Uint8Array(await new Response(stream).arrayBuffer()))}return 'j'+b64(bytes)}async function unpack(s){let bytes=unb64(s.slice(1));if(s[0]==='g'){if(!('DecompressionStream'in window))throw Error('Этот браузер не поддерживает распаковку паспорта');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}else if(s[0]!=='j')throw Error('Некорректный формат');return JSON.parse(new TextDecoder().decode(bytes))}
async function passportTab(b){$('#view').innerHTML='<div class="empty">Подготовка паспорта…</div>';try{const token=await pack(publicData(b));const base=location.href.split('?')[0].split('#')[0];const url=base+'?passport='+encodeURIComponent(token);$('#view').innerHTML=`<div class="notice">QR-паспорт содержит <b>снимок данных</b> на момент формирования. После изменения партии сформируйте новый QR-код. Для открытия на другом телефоне разместите страницу на публичном HTTPS-сайте.</div><div class="qrbox"><div id="qrcode"></div><b>QR-паспорт ${esc(b.id)}</b><div class="row"><button id="openpass" class="secondary">Просмотреть паспорт</button><button id="copypass">Скопировать ссылку</button><button id="printpass" class="secondary">Печать</button></div><div id="qrmsg" class="muted tiny" style="max-width:520px;overflow-wrap:anywhere;text-align:center"></div></div><p class="muted tiny">Никакой онлайн-базы нет: зашифрованный канал связи не заменяет проверку достоверности введённых данных. Сведения в QR не подтверждены независимой организацией.</p>`;$('#openpass').onclick=()=>window.open(url,'_blank');$('#copypass').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}catch{prompt('Скопируйте ссылку',url)}};$('#printpass').onclick=()=>print();if(window.QRCode){try{new QRCode($('#qrcode'),{text:url,width:220,height:220,colorDark:'#123c3b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L})}catch{$('#qrmsg').textContent='Ссылка слишком длинная для QR. Уменьшите количество записей; ссылка доступна по кнопке.'}}else{$('#qrcode').innerHTML='<div class="notice warning">Для генерации QR-кода необходимо интернет-соединение: библиотека QR загружается с CDN.</div>'}if(location.protocol==='file:')$('#qrmsg').textContent='Вы открыли файл локально. Для сканирования с другого устройства нужна публикация на веб-сайте. Сейчас можно проверить кнопку «Просмотреть паспорт» на этом компьютере.'}catch(e){$('#view').innerHTML='<div class="notice error">Ошибка формирования паспорта: '+esc(e.message)+'</div>'}}
function formMarkup(b){let val=(key)=>esc(b?.[key]??'');return `<form id="batchForm"><div class="grid2"><div class="field"><label>Номер партии</label><input name="id" maxlength="45" value="${val('id')}" required></div><div class="field"><label>Дата и время получения</label><input name="date" type="datetime-local" value="${val('date')||isoLocal()}" required></div><div class="field"><label>Хозяйство / производитель</label><input name="farm" maxlength="100" value="${val('farm')}" required></div><div class="field"><label>Объём, л</label><input name="volume" type="number" min="0.1" max="10000000" step="0.1" value="${val('volume')}" required></div><div class="field"><label>Место происхождения</label><input name="place" maxlength="100" value="${val('place')}" required></div><div class="field"><label>Тип продукции</label><input name="type" maxlength="100" value="${val('type')||'Сырое коровье молоко'}" required></div></div><div class="field"><label>Текущий этап</label><select name="status">${['Получено на ферме','На охлаждении','На хранении','Транспортировка','Передано на переработку','Переработано','Реализовано'].map(s=>`<option ${b?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Примечание</label><textarea name="notes" rows="2" maxlength="350">${val('notes')}</textarea></div><div class="row"><button type="submit">${b?'Сохранить изменения':'Создать партию'}</button><button type="button" class="secondary" id="cancel">Отмена</button>${b?'<button type="button" class="danger" id="delete">Удалить партию</button>':''}</div></form>`}
function bindForm(existing){$('#batchForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id=String(f.get('id')).trim();if(batches.some(x=>x.id===id&&x!==existing)){toast('Такой номер партии уже существует');return}let data={id,date:f.get('date'),farm:String(f.get('farm')).trim(),volume:Number(f.get('volume')),place:String(f.get('place')).trim(),type:String(f.get('type')).trim(),status:f.get('status'),notes:String(f.get('notes')).trim()};if(!Number.isFinite(data.volume)||data.volume<=0)return toast('Укажите корректный объём');if(existing)Object.assign(existing,data);else batches.unshift({...data,temps:[]});selected=id;tab='overview';save();layout();toast(existing?'Партия обновлена':'Партия создана')};$('#cancel').onclick=()=>{if(existing){tab='overview';detail()}else layout()};if(existing)$('#delete').onclick=()=>{if(confirm('Удалить партию вместе с её журналом?')){batches=batches.filter(x=>x!==existing);selected=batches[0]?.id||null;save();tab='overview';layout();toast('Партия удалена')}}}
function editForm(b){$('#view').innerHTML=formMarkup(b);bindForm(b)}function newForm(){$('#detail').innerHTML='<h2>Новая партия молока</h2>'+formMarkup(null);bindForm(null)}function passportView(b){document.title='Паспорт '+(b.id||'молока');let temp=Array.isArray(b.temps)?b.temps:[],hasBad=temp.some(t=>Number(t.value)<2||Number(t.value)>6);app.innerHTML=`<div class="shell">${head()}<article class="passport"><div class="row between"><span class="tag">Цифровой паспорт партии</span><span class="tag demo">Демонстрационные данные</span></div><div class="seal">🥛</div><h1>${esc(b.id)}</h1><p class="muted">Прослеживаемость молока: происхождение, этап движения и температурные записи</p><div class="info-grid"><div class="info"><span>Производитель</span><b>${esc(b.farm)}</b></div><div class="info"><span>Объём</span><b>${esc(b.volume)} л</b></div><div class="info"><span>Получено</span><b>${formatDate(b.date)}</b></div><div class="info"><span>Регион</span><b>${esc(b.place)}</b></div><div class="info"><span>Тип продукции</span><b>${esc(b.type)}</b></div><div class="info"><span>Этап</span><b>${esc(b.status)}</b></div></div><div class="notice ${hasBad?'error':'warning'}">${hasBad?'В журнале обнаружены отклонения от учебного температурного диапазона.':'Отклонений от учебного диапазона в представленных записях не обнаружено.'} <b>Это не заключение о безопасности молока.</b></div><h2>Температурный журнал</h2><div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Этап</th><th>Температура</th></tr></thead><tbody>${temp.length?temp.map(t=>`<tr><td>${formatDate(t.at)}</td><td>${esc(t.stage)}</td><td>${esc(t.value)} °C</td></tr>`).join(''):'<tr><td colspan="3">Данных нет</td></tr>'}</tbody></table></div><h2>Маршрут молока</h2><div class="flow">${['Ферма','Сбор','Охлаждение','Транспортировка','Переработка','Потребитель'].map((x,i)=>`<div class="step">${i+1}. ${x}</div>`).join('')}</div><p><b>Примечание:</b> ${esc(b.notes||'Нет')}</p><div class="separator"></div><p class="muted tiny">Данные введены оператором и не прошли независимую проверку. Паспорт представляет снимок записей на момент создания ссылки. Не заменяет документы о безопасности, ветеринарный контроль или государственную маркировку.</p><div class="row"><button id="return" class="secondary">← К кабинету</button><button onclick="print()">Распечатать</button></div></article></div>`;$('#return').onclick=()=>{location.href=location.href.split('?')[0]}}
(async()=>{const params=new URLSearchParams(location.search);if(params.has('passport'))try{const b=await unpack(params.get('passport'));if(!b||!b.id||!Array.isArray(b.temps))throw Error('Некорректные данные');passportView(b)}catch(e){app.innerHTML=`<main class="shell">${head()}<div class="notice error">Паспорт не удалось прочитать: ${esc(e.message)}</div><a class="btn secondary" href="${location.href.split('?')[0]}">К кабинету</a></main>`}else layout()})();
</script></body></html>
